AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless API for Solar Admin Dashboard

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId
        GROUNDTRUTH_BUCKET_DEV: !Ref GroundtruthBucketDev
        GROUNDTRUTH_BUCKET_PROD: !Ref GroundtruthBucketProd
        ORTHOS_BUCKET_DEV: !Ref OrthosBucketDev
        ORTHOS_BUCKET_PROD: !Ref OrthosBucketProd
        REPORTS_BUCKET_DEV: !Ref ReportsBucketDev
        REPORTS_BUCKET_PROD: !Ref ReportsBucketProd
        PROJECTS_TABLE_DEV: !Ref ProjectsTableDev
        PROJECTS_TABLE_PROD: !Ref ProjectsTableProd
        JOB_QUEUE_DEV: !Ref JobQueueDev
        JOB_QUEUE_PROD: !Ref JobQueueProd
        INFERENCE_JOB_DEF_DEV: !Ref InferenceJobDefinitionDev
        INFERENCE_JOB_DEF_PROD: !Ref InferenceJobDefinitionProd
        REPORT_JOB_DEF_DEV: !Ref ReportJobDefinitionDev
        REPORT_JOB_DEF_PROD: !Ref ReportJobDefinitionProd
        SENDER_EMAIL: !Ref SenderEmail
        TRAINING_DATA_BUCKET: !Ref TrainingDataBucket
        MODEL_REGISTRY_TABLE: !Ref ModelRegistryTable
        MODEL_REGISTRY_PROD_POINTER_PK: !Ref ModelRegistryProdPointerPk
        EL_UPLOADS_BUCKET_DEV: !Ref ELUploadsBucketDev
        EL_UPLOADS_BUCKET_PROD: !Ref ELUploadsBucketProd
        EL_GROUNDTRUTH_BUCKET_DEV: !Ref ELGroundtruthBucketDev
        EL_GROUNDTRUTH_BUCKET_PROD: !Ref ELGroundtruthBucketProd
        EL_REPORTS_BUCKET_DEV: !Ref ELReportsBucketDev
        EL_REPORTS_BUCKET_PROD: !Ref ELReportsBucketProd
        EL_REPORT_JOB_DEF_DEV: !Ref ELReportJobDefinitionDev
        EL_REPORT_JOB_DEF_PROD: !Ref ELReportJobDefinitionProd
        EL_INFERENCE_JOB_DEF_DEV: !Ref ELInferenceJobDefinitionDev
        EL_INFERENCE_JOB_DEF_PROD: !Ref ELInferenceJobDefinitionProd
        EL_INFERENCE_MODE: !Ref ELInferenceMode
        IV_UPLOADS_BUCKET_DEV: !Ref IVUploadsBucketDev
        IV_UPLOADS_BUCKET_PROD: !Ref IVUploadsBucketProd
        IV_REPORTS_BUCKET_DEV: !Ref IVReportsBucketDev
        IV_REPORTS_BUCKET_PROD: !Ref IVReportsBucketProd
        IV_REPORT_JOB_DEF_DEV: !Ref IVReportJobDefinitionDev
        IV_REPORT_JOB_DEF_PROD: !Ref IVReportJobDefinitionProd

Parameters:
  SenderEmail:
    Type: String
    Default: noreply@aisol.cloud
  AwsRegion:
    Type: String
    Default: us-east-2
  CognitoUserPoolId:
    Type: String
    Default: us-east-2_a98WW3Z3T
  CognitoClientId:
    Type: String
    Default: 6j57c6dts56j4gn0ctpokgob63
  GroundtruthBucketDev:
    Type: String
    Default: solar-groundtruth-dev
  GroundtruthBucketProd:
    Type: String
    Default: solar-groundtruth-prod
  OrthosBucketDev:
    Type: String
    Default: solar-orthos-dev
  OrthosBucketProd:
    Type: String
    Default: solar-orthos-prod
  ReportsBucketDev:
    Type: String
    Default: solar-reports-dev
  ReportsBucketProd:
    Type: String
    Default: solar-reports-prod
  ProjectsTableDev:
    Type: String
    Default: solar-projects-dev
  ProjectsTableProd:
    Type: String
    Default: solar-projects-prod
  JobQueueDev:
    Type: String
    Default: solar-job-queue-dev
  JobQueueProd:
    Type: String
    Default: solar-job-queue-prod
  InferenceJobDefinitionDev:
    Type: String
    Default: solar-inference-dev
  InferenceJobDefinitionProd:
    Type: String
    Default: solar-inference-prod
  ReportJobDefinitionDev:
    Type: String
    Default: solar-report-dev
  ReportJobDefinitionProd:
    Type: String
    Default: solar-report-prod
  TrainingDataBucket:
    Type: String
    Default: solar-ai-training
  ModelRegistryTable:
    Type: String
    Default: solar-model-registry-prod
  ModelRegistryProdPointerPk:
    Type: String
    Default: MODEL#PROD_POINTER
  RetrainJobQueue:
    Type: String
    Default: solar-gpu-queue-v2
  RetrainJobDefinition:
    Type: String
    Default: solar-detectron2-training-gpu:1
  CocoJobQueue:
    Type: String
    Default: solar-gpu-queue-v2
  CocoJobDefinition:
    Type: String
    Default: solar-detectron2-training-gpu:1
  ProdModelPrefix:
    Type: String
    Default: model-registry
  ELUploadsBucketDev:
    Type: String
    Default: solar-el-uploads-dev
  ELUploadsBucketProd:
    Type: String
    Default: solar-el-uploads-prod
  ELGroundtruthBucketDev:
    Type: String
    Default: solar-el-groundtruth-dev
  ELGroundtruthBucketProd:
    Type: String
    Default: solar-el-groundtruth-prod
  ELReportsBucketDev:
    Type: String
    Default: solar-el-reports-dev
  ELReportsBucketProd:
    Type: String
    Default: solar-el-reports-prod
  ELReportJobDefinitionDev:
    Type: String
    Default: solar-el-report-dev
  ELReportJobDefinitionProd:
    Type: String
    Default: solar-el-report-prod
  ELInferenceJobDefinitionDev:
    Type: String
    Default: solar-el-inference-dev
  ELInferenceJobDefinitionProd:
    Type: String
    Default: solar-el-inference-prod
  ELInferenceMode:
    Type: String
    Default: mock
    AllowedValues: [mock, batch]
    Description: 'EL detection mode — "mock" returns random bboxes (default, keeps UI functional until an EL Detectron2 checkpoint is trained); "batch" submits the real solar-el-inference-{env} Batch job.'
  IVUploadsBucketDev:
    Type: String
    Default: solar-iv-uploads-dev
  IVUploadsBucketProd:
    Type: String
    Default: solar-iv-uploads-prod
  IVReportsBucketDev:
    Type: String
    Default: solar-iv-reports-dev
  IVReportsBucketProd:
    Type: String
    Default: solar-iv-reports-prod
  IVReportJobDefinitionDev:
    Type: String
    Default: solar-iv-report-dev
  IVReportJobDefinitionProd:
    Type: String
    Default: solar-iv-report-prod

Resources:
  # ── Lambda Authorizer ──

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: authorizer/index.handler
      Timeout: 10
      MemorySize: 128

  AuthorizerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeAuthorizerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AuthorizerFunction.Arn

  # ── HTTP API ──

  AdminHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - https://d335vf81wvlg21.cloudfront.net
          - https://admin.solar.aisol.cloud
          - http://localhost:3000
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
      Auth:
        DefaultAuthorizer: LambdaAuthorizer
        Authorizers:
          LambdaAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionInvokeRole: !GetAtt AuthorizerInvokeRole.Arn
            AuthorizerPayloadFormatVersion: "2.0"
            EnableSimpleResponses: true
            Identity:
              ReauthorizeEvery: 0

  ProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: projects/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}
                - !Sub arn:aws:s3:::${OrthosBucketDev}
                - !Sub arn:aws:s3:::${OrthosBucketProd}
                - !Sub arn:aws:s3:::${ELUploadsBucketDev}
                - !Sub arn:aws:s3:::${ELUploadsBucketProd}
                - !Sub arn:aws:s3:::${IVUploadsBucketDev}
                - !Sub arn:aws:s3:::${IVUploadsBucketProd}
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
              Resource: !Sub arn:aws:cognito-idp:${AwsRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:BatchGetItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects
            Method: GET

  BillingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: billing/index.handler
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
              Resource: !Sub arn:aws:cognito-idp:${AwsRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /billing
            Method: GET

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: auth-login/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminGetUser
                - cognito-idp:GetUser
              Resource: !Sub arn:aws:cognito-idp:${AwsRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE

  CropAnnotationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: crop-annotations/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}/*
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
      Events:
        GetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/crop-annotations
            Method: GET
        PutApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/crop-annotations
            Method: PUT

  DefectAnnotationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: defect-annotations/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}/*
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
                - !Sub arn:aws:s3:::${ReportsBucketDev}/*
                - !Sub arn:aws:s3:::${ReportsBucketProd}/*
      Events:
        GetApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/annotations
            Method: GET
        PutApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/annotations
            Method: PUT

  ProjectStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: project-status/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}/*
                - !Sub arn:aws:s3:::${OrthosBucketDev}
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
                - !Sub arn:aws:s3:::${ReportsBucketDev}
                - !Sub arn:aws:s3:::${ReportsBucketDev}/*
                - !Sub arn:aws:s3:::${ReportsBucketProd}
                - !Sub arn:aws:s3:::${ReportsBucketProd}/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/status
            Method: GET

  RunInferenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: run-inference/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - batch:SubmitJob
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/run-inference
            Method: POST

  ProjectActionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: project-actions/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - batch:SubmitJob
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:HeadObject
                - s3:PutObject
                - s3:CopyObject
              Resource:
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}/*
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
                - arn:aws:s3:::solar-ai-training/*
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                - arn:aws:s3:::solar-uploads-dev
                - arn:aws:s3:::solar-uploads-prod
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:DeleteObject
              Resource:
                - arn:aws:s3:::solar-uploads-dev/*
                - arn:aws:s3:::solar-uploads-prod/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
              Resource: !Sub arn:aws:cognito-idp:${AwsRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/actions/{actionType}
            Method: POST

  AlignPanelsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: align-panels/index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/align-panels
            Method: POST

  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: create-project/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
              Resource: !Sub arn:aws:cognito-idp:${AwsRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/create
            Method: POST

  UploadPresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: upload-presign/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - arn:aws:s3:::solar-uploads-dev/*
                - arn:aws:s3:::solar-uploads-prod/*
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/presign-upload
            Method: POST

  UploadCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: upload-complete/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:HeadObject
              Resource:
                - arn:aws:s3:::solar-uploads-dev/*
                - arn:aws:s3:::solar-uploads-prod/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/files/{fileId}/complete
            Method: POST

  FinalizeUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: finalize-upload/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/finalize-upload
            Method: POST

  StartOdmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: start-odm/index.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
                - states:ListExecutions
              Resource:
                - arn:aws:states:us-east-2:002938753233:stateMachine:solar-processing-dev
                - arn:aws:states:us-east-2:002938753233:stateMachine:solar-processing-prod
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - arn:aws:s3:::solar-uploads-dev/*
                - arn:aws:s3:::solar-uploads-prod/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/start-odm
            Method: POST

  S3PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: s3-presign/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${ReportsBucketDev}/*
                - !Sub arn:aws:s3:::${ReportsBucketProd}/*
                - arn:aws:s3:::solar-uploads-dev/*
                - arn:aws:s3:::solar-uploads-prod/*
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /s3/presigned-url
            Method: GET

  TexContentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: tex-content/index.handler
      Timeout: 30
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${ReportsBucketDev}/*
                - !Sub arn:aws:s3:::${ReportsBucketProd}/*
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/tex-content
            Method: GET
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/tex-content
            Method: PUT

  ModelRegistryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: model-registry/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ModelRegistryTable}
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${TrainingDataBucket}
                - !Sub arn:aws:s3:::${TrainingDataBucket}/*
            - Effect: Allow
              Action:
                - batch:SubmitJob
              Resource:
                - !Sub arn:aws:batch:${AwsRegion}:${AWS::AccountId}:job-queue/${RetrainJobQueue}
                - !Sub arn:aws:batch:${AwsRegion}:${AWS::AccountId}:job-definition/${RetrainJobDefinition}
                - !Sub arn:aws:batch:${AwsRegion}:${AWS::AccountId}:job-queue/${CocoJobQueue}
                - !Sub arn:aws:batch:${AwsRegion}:${AWS::AccountId}:job-definition/${CocoJobDefinition}
      Environment:
        Variables:
          TRAINING_DATA_BUCKET: !Ref TrainingDataBucket
          MODEL_REGISTRY_TABLE: !Ref ModelRegistryTable
          MODEL_REGISTRY_PROD_POINTER_PK: !Ref ModelRegistryProdPointerPk
          RETRAIN_JOB_QUEUE: !Ref RetrainJobQueue
          RETRAIN_JOB_DEFINITION: !Ref RetrainJobDefinition
