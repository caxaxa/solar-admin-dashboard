AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless API for Solar Admin Dashboard

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        COGNITO_CLIENT_ID: !Ref CognitoClientId
        GROUNDTRUTH_BUCKET_DEV: !Ref GroundtruthBucketDev
        GROUNDTRUTH_BUCKET_PROD: !Ref GroundtruthBucketProd
        ORTHOS_BUCKET_DEV: !Ref OrthosBucketDev
        ORTHOS_BUCKET_PROD: !Ref OrthosBucketProd
        REPORTS_BUCKET_DEV: !Ref ReportsBucketDev
        REPORTS_BUCKET_PROD: !Ref ReportsBucketProd
        PROJECTS_TABLE_DEV: !Ref ProjectsTableDev
        PROJECTS_TABLE_PROD: !Ref ProjectsTableProd
        JOB_QUEUE_DEV: !Ref JobQueueDev
        JOB_QUEUE_PROD: !Ref JobQueueProd
        INFERENCE_JOB_DEF_DEV: !Ref InferenceJobDefinitionDev
        INFERENCE_JOB_DEF_PROD: !Ref InferenceJobDefinitionProd
        REPORT_JOB_DEF_DEV: !Ref ReportJobDefinitionDev
        REPORT_JOB_DEF_PROD: !Ref ReportJobDefinitionProd
        SENDER_EMAIL: !Ref SenderEmail
        TRAINING_DATA_BUCKET: !Ref TrainingDataBucket
        MODEL_REGISTRY_TABLE: !Ref ModelRegistryTable
        MODEL_REGISTRY_PROD_POINTER_PK: !Ref ModelRegistryProdPointerPk

Parameters:
  SenderEmail:
    Type: String
    Default: noreply@aisol.cloud
  AwsRegion:
    Type: String
    Default: us-east-2
  CognitoUserPoolId:
    Type: String
    Default: us-east-2_a98WW3Z3T
  CognitoClientId:
    Type: String
    Default: 6j57c6dts56j4gn0ctpokgob63
  GroundtruthBucketDev:
    Type: String
    Default: solar-groundtruth-dev
  GroundtruthBucketProd:
    Type: String
    Default: solar-groundtruth-prod
  OrthosBucketDev:
    Type: String
    Default: solar-orthos-dev
  OrthosBucketProd:
    Type: String
    Default: solar-orthos-prod
  ReportsBucketDev:
    Type: String
    Default: solar-reports-dev
  ReportsBucketProd:
    Type: String
    Default: solar-reports-prod
  ProjectsTableDev:
    Type: String
    Default: solar-projects-dev
  ProjectsTableProd:
    Type: String
    Default: solar-projects-prod
  JobQueueDev:
    Type: String
    Default: solar-job-queue-dev
  JobQueueProd:
    Type: String
    Default: solar-job-queue-prod
  InferenceJobDefinitionDev:
    Type: String
    Default: solar-inference-dev
  InferenceJobDefinitionProd:
    Type: String
    Default: solar-inference-prod
  ReportJobDefinitionDev:
    Type: String
    Default: solar-report-dev
  ReportJobDefinitionProd:
    Type: String
    Default: solar-report-prod
  TrainingDataBucket:
    Type: String
    Default: solar-ai-training
  ModelRegistryTable:
    Type: String
    Default: solar-model-registry-prod
  ModelRegistryProdPointerPk:
    Type: String
    Default: MODEL#PROD_POINTER
  RetrainJobQueue:
    Type: String
    Default: solar-gpu-queue-v2
  RetrainJobDefinition:
    Type: String
    Default: solar-detectron2-training-gpu:1
  CocoJobQueue:
    Type: String
    Default: solar-gpu-queue-v2
  CocoJobDefinition:
    Type: String
    Default: solar-detectron2-training-gpu:1
  ProdModelPrefix:
    Type: String
    Default: model-registry

Resources:
  AdminHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - https://d335vf81wvlg21.cloudfront.net
          - https://admin.solar.aisol.cloud
          - http://localhost:3000
        AllowHeaders:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  ProjectsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: projects/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}
                - !Sub arn:aws:s3:::${OrthosBucketDev}
                - !Sub arn:aws:s3:::${OrthosBucketProd}
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
              Resource: !Sub arn:aws:cognito-idp:${AwsRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:BatchGetItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects
            Method: GET

  AuthLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: auth-login/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:AdminGetUser
                - cognito-idp:GetUser
              Resource: !Sub arn:aws:cognito-idp:${AwsRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /auth/login
            Method: POST

  CropAnnotationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: crop-annotations/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}/*
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/crop-annotations
            Method: ANY

  DefectAnnotationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: defect-annotations/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}/*
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
                - !Sub arn:aws:s3:::${ReportsBucketDev}/*
                - !Sub arn:aws:s3:::${ReportsBucketProd}/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/annotations
            Method: ANY

  ProjectStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: project-status/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}/*
                - !Sub arn:aws:s3:::${OrthosBucketDev}
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
                - !Sub arn:aws:s3:::${ReportsBucketDev}
                - !Sub arn:aws:s3:::${ReportsBucketDev}/*
                - !Sub arn:aws:s3:::${ReportsBucketProd}
                - !Sub arn:aws:s3:::${ReportsBucketProd}/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/status
            Method: GET

  RunInferenceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: run-inference/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - batch:SubmitJob
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/run-inference
            Method: POST

  ProjectActionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: project-actions/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - batch:SubmitJob
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:HeadObject
                - s3:PutObject
                - s3:CopyObject
              Resource:
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}/*
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
                - arn:aws:s3:::solar-ai-training/*
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                - arn:aws:s3:::solar-uploads-dev
                - arn:aws:s3:::solar-uploads-prod
            - Effect: Allow
              Action:
                - s3:ListBucket
                - s3:DeleteObject
              Resource:
                - arn:aws:s3:::solar-uploads-dev/*
                - arn:aws:s3:::solar-uploads-prod/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:DeleteItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
              Resource: !Sub arn:aws:cognito-idp:${AwsRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/actions/{actionType}
            Method: POST

  AlignPanelsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: align-panels/index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/align-panels
            Method: POST

  CreateProjectFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: create-project/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
                - cognito-idp:ListUsersInGroup
              Resource: !Sub arn:aws:cognito-idp:${AwsRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/create
            Method: POST

  UploadPresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: upload-presign/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - arn:aws:s3:::solar-uploads-dev/*
                - arn:aws:s3:::solar-uploads-prod/*
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/presign-upload
            Method: POST

  UploadCompleteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: upload-complete/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:HeadObject
              Resource:
                - arn:aws:s3:::solar-uploads-dev/*
                - arn:aws:s3:::solar-uploads-prod/*
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/files/{fileId}/complete
            Method: POST

  FinalizeUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: finalize-upload/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/finalize-upload
            Method: POST

  StartOdmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: start-odm/index.handler
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - states:StartExecution
                - states:ListExecutions
              Resource:
                - arn:aws:states:us-east-2:002938753233:stateMachine:solar-processing-dev
                - arn:aws:states:us-east-2:002938753233:stateMachine:solar-processing-prod
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:UpdateItem
              Resource:
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableDev}
                - !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ProjectsTableProd}
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource:
                - arn:aws:s3:::solar-uploads-dev/*
                - arn:aws:s3:::solar-uploads-prod/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/start-odm
            Method: POST

  S3PresignFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: s3-presign/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${ReportsBucketDev}/*
                - !Sub arn:aws:s3:::${ReportsBucketProd}/*
                - arn:aws:s3:::solar-uploads-dev/*
                - arn:aws:s3:::solar-uploads-prod/*
                - !Sub arn:aws:s3:::${OrthosBucketDev}/*
                - !Sub arn:aws:s3:::${OrthosBucketProd}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketDev}/*
                - !Sub arn:aws:s3:::${GroundtruthBucketProd}/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /s3/presigned-url
            Method: GET

  TexContentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: tex-content/index.handler
      Timeout: 30
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - !Sub arn:aws:s3:::${ReportsBucketDev}/*
                - !Sub arn:aws:s3:::${ReportsBucketProd}/*
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/tex-content
            Method: GET
        Put:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /projects/{orgId}/{projectId}/tex-content
            Method: PUT

  ModelRegistryFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/
      Handler: model-registry/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource: !Sub arn:aws:dynamodb:${AwsRegion}:${AWS::AccountId}:table/${ModelRegistryTable}
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - !Sub arn:aws:s3:::${TrainingDataBucket}
                - !Sub arn:aws:s3:::${TrainingDataBucket}/*
            - Effect: Allow
              Action:
                - batch:SubmitJob
              Resource:
                - !Sub arn:aws:batch:${AwsRegion}:${AWS::AccountId}:job-queue/${RetrainJobQueue}
                - !Sub arn:aws:batch:${AwsRegion}:${AWS::AccountId}:job-definition/${RetrainJobDefinition}
                - !Sub arn:aws:batch:${AwsRegion}:${AWS::AccountId}:job-queue/${CocoJobQueue}
                - !Sub arn:aws:batch:${AwsRegion}:${AWS::AccountId}:job-definition/${CocoJobDefinition}
      Environment:
        Variables:
          TRAINING_DATA_BUCKET: !Ref TrainingDataBucket
          MODEL_REGISTRY_TABLE: !Ref ModelRegistryTable
          MODEL_REGISTRY_PROD_POINTER_PK: !Ref ModelRegistryProdPointerPk
          RETRAIN_JOB_QUEUE: !Ref RetrainJobQueue
          RETRAIN_JOB_DEFINITION: !Ref RetrainJobDefinition
          COCO_JOB_QUEUE: !Ref CocoJobQueue
          COCO_JOB_DEFINITION: !Ref CocoJobDefinition
          OUTPUT_BUCKET: !Ref TrainingDataBucket
          PROD_MODEL_PREFIX: !Ref ProdModelPrefix
          DATASET_UPLOAD_PREFIX: !Sub s3://${TrainingDataBucket}/datasets
      Events:
        ListModels:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /api/model-registry
            Method: GET
        Retrain:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /api/model-registry/retrain
            Method: POST
        Promote:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /api/model-registry/{modelVersion}/promote
            Method: POST
        DeleteModel:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /api/model-registry/{modelVersion}
            Method: DELETE
        LaunchRetrain:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /api/model-registry/{modelVersion}/launch
            Method: POST
        TrainingArchives:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /api/training-data/archives
            Method: GET
        TrainingManifest:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /api/training-data/manifests
            Method: POST
        BuildCoco:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /api/training-data/coco
            Method: POST
        CocoStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /api/training-data/coco/status
            Method: POST
        PrepareRetrain:
          Type: HttpApi
          Properties:
            ApiId: !Ref AdminHttpApi
            Path: /api/model-registry/prepare
            Method: POST

Outputs:
  ApiEndpoint:
    Description: HTTPS endpoint for the admin API
    Value: !Sub https://${AdminHttpApi}.execute-api.${AwsRegion}.amazonaws.com
